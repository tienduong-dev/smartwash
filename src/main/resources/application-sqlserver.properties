# =====================================================================
# KẾT NỐI SQL SERVER
# Kích hoạt bằng dòng spring.profiles.active=sqlserver trong application.properties
# =====================================================================

# localhost:1433 là instance mặc định. Nếu máy bạn chạy instance có tên riêng
# và KHÔNG mở cổng 1433 thì thay bằng:
#   jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=banmayruabat;...
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=banmayruabat;encrypt=true;trustServerCertificate=true
spring.datasource.username=smartwash
spring.datasource.password=SmartWash@2026
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Không cần khai báo hibernate.dialect: Hibernate 6 tự nhận ra SQL Server
# qua trình điều khiển (khai báo thừa sẽ bị cảnh báo HHH90000025).

# SQL Server mặc định dùng READ COMMITTED có khoá đọc, dễ bị chờ nhau khi
# nhiều người cùng đặt hàng. Bật snapshot isolation ở mức câu lệnh cho nhẹ hơn:
#   ALTER DATABASE banmayruabat SET READ_COMMITTED_SNAPSHOT ON;
