<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/seller}">
<head><title>Sản phẩm</title></head>
<body>
<h1 layout:fragment="pageTitle">Sản phẩm</h1>
<p layout:fragment="pageSubtitle" th:text="${ds.total} + ' sản phẩm · thương hiệu ' + ${store.brandName}">…</p>
<div layout:fragment="pageActions">
  <a th:href="@{'/seller/' + ${store.id} + '/products/new'}" class="btn btn-dark btn-sm">
    <svg th:replace="~{fragments/icons :: plus('16')}"></svg>
    Thêm sản phẩm
  </a>
</div>

<div layout:fragment="content">

  <div th:if="${soSapHet > 0 or soHetHang > 0}" class="alert alert-info mb-5">
    <svg th:replace="~{fragments/icons :: info('18')}"></svg>
    <p>
      <span th:if="${soHetHang > 0}" class="tnum" th:text="${soHetHang} + ' sản phẩm đã hết hàng'"></span>
      <span th:if="${soHetHang > 0 and soSapHet > 0}">, </span>
      <span th:if="${soSapHet > 0}" class="tnum" th:text="${soSapHet} + ' sản phẩm sắp hết'"></span>.
      Cập nhật tồn kho để không lỡ đơn.
    </p>
  </div>

  <form method="get" class="card p-4 mb-5 grid md:grid-cols-[1fr_200px_auto] gap-3">
    <input class="input" name="q" th:value="${q}" placeholder="Tìm theo tên hoặc mã model…">
    <select class="select" name="status">
      <option value="">Mọi trạng thái</option>
      <option value="DRAFT"          th:selected="${status == 'DRAFT'}">Bản nháp</option>
      <option value="PENDING_REVIEW" th:selected="${status == 'PENDING_REVIEW'}">Chờ duyệt</option>
      <option value="ACTIVE"         th:selected="${status == 'ACTIVE'}">Đang bán</option>
      <option value="REJECTED"       th:selected="${status == 'REJECTED'}">Bị từ chối</option>
      <option value="INACTIVE"       th:selected="${status == 'INACTIVE'}">Ngừng bán</option>
      <option value="SUSPENDED"      th:selected="${status == 'SUSPENDED'}">Bị gỡ</option>
    </select>
    <button type="submit" class="btn btn-dark">Lọc</button>
  </form>

  <div class="card overflow-x-auto">
    <div th:if="${ds.empty}">
      <div th:replace="~{fragments/alerts :: empty('Chưa có sản phẩm nào', 'Bấm “Thêm sản phẩm” để đăng chiếc máy giặt đầu tiên.')}"></div>
    </div>

    <table class="table table-hover" th:unless="${ds.empty}">
      <thead>
        <tr><th>Sản phẩm</th><th>Giá bán</th><th>Tồn kho</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="p : ${ds.items}">
          <td><div th:replace="~{fragments/san-pham :: dong(${p})}"></div></td>
          <td>
            <p class="font-medium tnum" th:text="${#numbers.formatInteger(p.effectivePrice, 0, 'POINT')} + '₫'">0₫</p>
            <p th:if="${p.onSale}" class="text-[12px] text-brand-500 font-medium tnum"
               th:text="'giảm ' + ${p.discountPercent} + '%'">…</p>
          </td>
          <td>
            <span th:if="${p.inventory != null}" class="badge"
                  th:classappend="' ' + ${p.inventory.statusBadge}"
                  th:text="${p.sellableQuantity} + ' — ' + ${p.inventory.statusLabel}">…</span>
            <span th:unless="${p.inventory != null}" class="text-faint">—</span>
          </td>
          <td>
            <span class="badge" th:classappend="' ' + ${p.statusBadge}" th:text="${p.statusLabel}">…</span>
            <p th:if="${p.rejectReason != null}" class="text-[12px] text-red-600 mt-1 truncate max-w-[180px]"
               th:text="${p.rejectReason}">…</p>
          </td>
          <td class="tnum text-muted"
              th:text="${p.updatedAt != null} ? ${#temporals.format(p.updatedAt, 'dd/MM/yy')} : '—'">—</td>
          <td class="text-right">
            <a th:href="@{'/seller/' + ${store.id} + '/products/' + ${p.id}}"
               class="btn btn-ghost btn-sm">Sửa</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:replace="~{fragments/pagination :: paging(${ds})}"></nav>
</div>
</body>
</html>
