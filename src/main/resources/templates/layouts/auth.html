<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title layout:title-pattern="$CONTENT_TITLE — SmartWash">SmartWash</title>
  <meta name="csrf-token" th:content="${_csrf != null ? _csrf.token : ''}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
</head>
<body class="min-h-screen grid lg:grid-cols-2">

<!-- Cột trái: khung form -->
<div class="flex flex-col px-6 sm:px-12 lg:px-16 py-10">
  <a th:href="@{/}" class="flex items-center gap-2.5 w-max">
    <svg th:replace="~{fragments/icons :: logo('26')}"></svg>
    <span class="text-[19px] font-extrabold tracking-[-0.035em]">SmartWash</span>
  </a>

  <div class="flex-1 grid place-items-center py-10">
    <div class="w-full max-w-[380px]">
      <div th:replace="~{fragments/alerts :: alerts}" class="mb-5"></div>
      <div layout:fragment="content"></div>
    </div>
  </div>

  <p class="text-[13px] text-faint">© 2026 SmartWash</p>
</div>

<!-- Cột phải: mảng hình, ẩn trên màn hình nhỏ -->
<div class="hidden lg:flex bg-surface items-center justify-center p-16 relative overflow-hidden">
  <div class="max-w-md relative z-10">
    <p class="eyebrow mb-5">Sàn máy giặt chính hãng</p>
    <h2 class="display-2">Một tài khoản,<br>mọi gian hàng.</h2>
    <p class="mt-5 text-[15px] leading-relaxed text-muted">
      Mua hàng từ các gian hàng uỷ quyền, theo dõi đơn và bảo hành ở cùng một nơi.
      Muốn bán hàng? Mở gian hàng ngay trên cùng tài khoản này.
    </p>
    <dl class="mt-10 grid grid-cols-3 gap-5">
      <div>
        <dt class="text-2xl font-bold tnum tracking-tight">13</dt>
        <dd class="text-[13px] text-muted mt-0.5">thương hiệu</dd>
      </div>
      <div class="border-l border-line pl-5">
        <dt class="text-2xl font-bold tnum tracking-tight">11</dt>
        <dd class="text-[13px] text-muted mt-0.5">gian hàng</dd>
      </div>
      <div class="border-l border-line pl-5">
        <dt class="text-2xl font-bold tnum tracking-tight">4.8<span class="text-base font-semibold text-faint">/5</span></dt>
        <dd class="text-[13px] text-muted mt-0.5">đánh giá</dd>
      </div>
    </dl>
  </div>
  <img th:src="@{/img/products/cua-ngang-lg.svg}" alt=""
       class="absolute -right-20 -bottom-20 w-[460px] opacity-[0.07] pointer-events-none" aria-hidden="true">
</div>

</body>
</html>
