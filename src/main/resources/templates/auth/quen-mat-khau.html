<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/auth}">
<head><title>Quên mật khẩu</title></head>
<body>
<div layout:fragment="content">

  <h1 class="text-[26px] font-bold tracking-[-0.03em]">Quên mật khẩu</h1>
  <p class="mt-2 text-sm text-muted">
    Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.
  </p>

  <form th:action="@{/forgot-password}" method="post" class="mt-8 space-y-4">
    <div>
      <label class="label" for="email">Email</label>
      <input class="input" type="email" id="email" name="email" required autofocus
             autocomplete="email" placeholder="ban@example.com">
    </div>
    <button type="submit" class="btn btn-dark btn-block btn-lg">Gửi liên kết đặt lại</button>
  </form>

  <p class="mt-6 text-center text-sm">
    <a th:href="@{/login}" class="text-muted hover:text-ink transition">Quay lại đăng nhập</a>
  </p>
</div>
</body>
</html>
