<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/app}">
<head><title>Sổ địa chỉ</title></head>
<body>
<div layout:fragment="content" class="mx-auto max-w-[1280px] px-6 lg:px-10 py-8">

  <h1 class="text-[22px] font-bold tracking-[-0.025em]">Sổ địa chỉ</h1>
  <p class="mt-1 text-sm text-muted">Địa chỉ mặc định được điền sẵn khi bạn đặt hàng.</p>

  <div class="grid lg:grid-cols-[1fr_380px] gap-6 mt-6 items-start">

    <!-- Danh sách -->
    <div class="space-y-3">
      <div th:if="${#lists.isEmpty(diaChi)}" class="card">
        <div th:replace="~{fragments/alerts :: empty('Chưa có địa chỉ nào', 'Thêm địa chỉ đầu tiên để đặt hàng nhanh hơn.')}"></div>
      </div>

      <div th:each="a : ${diaChi}" class="card p-5">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <p class="font-semibold" th:text="${a.receiverName}">…</p>
              <span class="text-muted text-sm tnum" th:text="${a.phone}">…</span>
              <span th:if="${a.defaultAddress}" class="badge badge-dark">Mặc định</span>
              <span th:if="${a.label != null}" class="badge badge-neutral" th:text="${a.label}">…</span>
            </div>
            <p class="mt-1.5 text-sm text-muted leading-relaxed" th:text="${a.fullAddress}">…</p>
          </div>

          <div class="flex items-center gap-1 shrink-0">
            <form th:if="${!a.defaultAddress}" th:action="@{'/addresses/' + ${a.id} + '/default'}" method="post">
              <button class="btn btn-ghost btn-sm" type="submit">Đặt mặc định</button>
            </form>
            <form th:action="@{'/addresses/' + ${a.id} + '/delete'}" method="post"
                  onsubmit="return confirm('Xoá địa chỉ này?');">
              <button class="btn btn-ghost btn-sm text-red-600" type="submit">Xoá</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Thêm mới -->
    <div class="card p-6 lg:sticky lg:top-24">
      <p class="font-semibold mb-4">Thêm địa chỉ mới</p>
      <form th:action="@{/addresses}" method="post" class="space-y-3.5">
        <div>
          <label class="label" for="label">Nhãn</label>
          <input class="input" id="label" name="label" placeholder="Nhà riêng, Công ty…">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label" for="receiverName">Người nhận</label>
            <input class="input" id="receiverName" name="receiverName" required>
          </div>
          <div>
            <label class="label" for="phoneA">Điện thoại</label>
            <input class="input" id="phoneA" name="phone" inputmode="numeric" required placeholder="0912345678">
          </div>
        </div>

        <div>
          <label class="label" for="provinceName">Tỉnh / Thành phố</label>
          <input class="input" id="provinceName" name="provinceName" required placeholder="Hà Nội">
          <input type="hidden" name="provinceId" value="1">
        </div>
        <div>
          <label class="label" for="districtName">Quận / Huyện</label>
          <input class="input" id="districtName" name="districtName" required placeholder="Cầu Giấy">
          <input type="hidden" name="districtId" value="1">
        </div>
        <div>
          <label class="label" for="wardName">Phường / Xã</label>
          <input class="input" id="wardName" name="wardName" required placeholder="Dịch Vọng">
          <input type="hidden" name="wardCode" value="00000">
        </div>
        <div>
          <label class="label" for="line">Số nhà, tên đường</label>
          <input class="input" id="line" name="line" required placeholder="Số 1, ngõ 2, đường Xuân Thuỷ">
        </div>

        <label class="flex items-center gap-2.5 pt-1 cursor-pointer">
          <input type="checkbox" name="isDefault" value="true" class="w-4 h-4 accent-black">
          <span class="text-sm">Đặt làm địa chỉ mặc định</span>
        </label>

        <button type="submit" class="btn btn-dark btn-block">Thêm địa chỉ</button>
        <p class="form-hint">
          Danh sách tỉnh / huyện / xã sẽ lấy tự động từ dịch vụ vận chuyển ở bước giao hàng.
        </p>
      </form>
    </div>
  </div>
</div>
</body>
</html>
