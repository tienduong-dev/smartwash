<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head><title>Hồ sơ mở gian hàng</title></head>
<body>
<h1 layout:fragment="pageTitle">Hồ sơ mở gian hàng</h1>
<p layout:fragment="pageSubtitle" th:text="${ds.total} + ' hồ sơ'">…</p>

<div layout:fragment="content">

  <form method="get" class="card p-4 mb-5 grid md:grid-cols-[1fr_200px_200px_auto] gap-3">
    <input class="input" name="q" th:value="${q}" placeholder="Tìm theo mã hồ sơ hoặc tên gian hàng…">
    <select class="select" name="status">
      <option value="">Mọi trạng thái</option>
      <option value="PENDING"         th:selected="${status == 'PENDING'}">Chờ tiếp nhận</option>
      <option value="UNDER_REVIEW"    th:selected="${status == 'UNDER_REVIEW'}">Đang thẩm định</option>
      <option value="NEEDS_MORE_INFO" th:selected="${status == 'NEEDS_MORE_INFO'}">Cần bổ sung</option>
      <option value="APPROVED"        th:selected="${status == 'APPROVED'}">Đã duyệt</option>
      <option value="REJECTED"        th:selected="${status == 'REJECTED'}">Từ chối</option>
      <option value="CANCELLED"       th:selected="${status == 'CANCELLED'}">Đã huỷ</option>
    </select>
    <select class="select" name="type">
      <option value="">Mọi loại hình</option>
      <option value="OFFICIAL"    th:selected="${type == 'OFFICIAL'}">Chính hãng</option>
      <option value="DISTRIBUTOR" th:selected="${type == 'DISTRIBUTOR'}">Phân phối uỷ quyền</option>
      <option value="RETAILER"    th:selected="${type == 'RETAILER'}">Bán lẻ</option>
    </select>
    <button type="submit" class="btn btn-dark">Lọc</button>
  </form>

  <div class="card overflow-x-auto">
    <div th:if="${ds.empty}">
      <div th:replace="~{fragments/alerts :: empty('Không có hồ sơ nào', 'Thử bỏ bớt điều kiện lọc.')}"></div>
    </div>

    <table class="table table-hover" th:unless="${ds.empty}">
      <thead>
        <tr><th>Mã</th><th>Gian hàng</th><th>Người nộp</th><th>Thương hiệu</th>
            <th>Loại</th><th>Trạng thái</th><th>Ngày nộp</th><th></th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${ds.items}">
          <td class="tnum font-medium" th:text="${r.code}">…</td>
          <td>
            <p th:text="${r.storeName}">…</p>
            <p th:if="${r.newBrandProposal}" class="text-[12px] text-brand-500 font-medium">Đề xuất thương hiệu mới</p>
          </td>
          <td class="text-muted" th:text="${r.applicant.fullName}">…</td>
          <td class="text-muted" th:text="${r.brandDisplay}">…</td>
          <td><span class="badge badge-neutral" th:text="${r.storeTypeLabel}">…</span></td>
          <td><span class="badge" th:classappend="' ' + ${r.statusBadge}" th:text="${r.statusLabel}">…</span></td>
          <td class="text-muted tnum" th:text="${#temporals.format(r.createdAt, 'dd/MM/yyyy')}">…</td>
          <td class="text-right">
            <a th:href="@{'/admin/registrations/' + ${r.id}}" class="btn btn-ghost btn-sm">Mở</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:replace="~{fragments/pagination :: paging(${ds})}"></nav>
</div>
</body>
</html>
