<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/app}">
<head><title>Đơn hàng của tôi</title></head>
<body>
<div layout:fragment="content" class="mx-auto max-w-[1280px] px-6 lg:px-10 py-8">

  <h1 class="text-[22px] font-bold tracking-[-0.025em]">Đơn hàng của tôi</h1>
  <p class="mt-1 text-sm text-muted tnum" th:text="${ds.total} + ' đơn'">…</p>

  <div th:if="${ds.empty}" class="card mt-6">
    <div th:replace="~{fragments/alerts :: empty('Chưa có đơn hàng nào', 'Đơn bạn đặt sẽ hiện ở đây.')}"></div>
    <div class="pb-10 text-center">
      <a th:href="@{/products}" class="btn btn-dark">Xem sản phẩm</a>
    </div>
  </div>

  <div th:unless="${ds.empty}" class="space-y-4 mt-6">
    <a th:each="o : ${ds.items}" th:href="@{'/orders/' + ${o.orderCode}}"
       class="card p-5 block hover:border-ink transition">

      <div class="flex items-start gap-4 flex-wrap">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="font-bold tnum" th:text="${o.orderCode}">SW000000</span>
            <span class="badge" th:classappend="' ' + ${o.statusBadge}"
                  th:text="${o.statusLabel}">Trạng thái</span>
            <span th:if="${o.paid}" class="badge badge-success">Đã thanh toán</span>
          </div>
          <p class="text-[13px] text-muted mt-1 tnum"
             th:text="${#temporals.format(o.placedAt, 'HH:mm dd/MM/yyyy')}">…</p>
          <p class="text-[13px] text-muted mt-0.5" th:text="${o.paymentMethodLabel}">…</p>
        </div>

        <div class="text-right shrink-0">
          <p class="text-[19px] font-bold tnum"
             th:text="${#numbers.formatInteger(o.grandTotal, 0, 'POINT')} + '₫'">0₫</p>
          <p class="text-[13px] text-muted tnum mt-0.5"
             th:text="${o.totalQuantity} + ' sản phẩm · ' + ${#lists.size(o.storeOrders)} + ' gian hàng'">…</p>
        </div>
      </div>
    </a>
  </div>

  <nav th:replace="~{fragments/pagination :: paging(${ds})}"></nav>
</div>
</body>
</html>
