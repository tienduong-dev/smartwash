<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Thẻ sản phẩm dùng chung cho trang chủ, danh sách, trang gian hàng.
  Dùng: <article th:replace="~{fragments/san-pham :: the(${p})}"></article>
-->
<article th:fragment="the(p)" class="product-tile group">
  <a th:href="@{'/products/' + ${p.slug}}" class="block">
    <div class="tile aspect-square overflow-hidden relative">
      <img th:src="${p.imageUrl}" th:alt="${p.name}"
           class="w-full h-full object-contain p-6 transition duration-500 group-hover:scale-105"
           loading="lazy">

      <div class="absolute top-3 left-3 flex flex-col gap-1.5 items-start">
        <span th:if="${p.onSale}" class="badge badge-brand"
              th:text="'-' + ${p.discountPercent} + '%'">-10%</span>
        <span th:if="${p.store != null and p.store.official}" class="badge badge-dark">Chính hãng</span>
      </div>

      <span th:unless="${p.inStock}"
            class="absolute inset-x-0 bottom-0 bg-ink/80 text-white text-[12px] font-semibold text-center py-1.5">
        Tạm hết hàng
      </span>
    </div>

    <div class="pt-3.5">
      <p class="text-[12px] text-faint" th:text="${p.brandName}">Thương hiệu</p>
      <h3 class="mt-0.5 font-semibold leading-snug truncate-2" th:text="${p.name}">Tên sản phẩm</h3>

      <div class="mt-2 flex items-baseline gap-2">
        <span class="font-bold tnum" th:text="${#numbers.formatInteger(p.effectivePrice, 0, 'POINT')} + '₫'">0₫</span>
        <span th:if="${p.compareAtPrice != null}" class="text-[13px] text-faint line-through tnum"
              th:text="${#numbers.formatInteger(p.compareAtPrice, 0, 'POINT')} + '₫'">0₫</span>
      </div>

      <div class="mt-1.5 flex items-center gap-2 text-[12px] text-muted">
        <span th:if="${p.capacityKg != null}" th:text="${p.capacityLabel}">9 kg</span>
        <span th:if="${p.capacityKg != null and p.doorType != null}" class="text-line">·</span>
        <span th:if="${p.doorType != null}" th:text="${p.doorTypeLabel}">Cửa ngang</span>
        <span th:if="${p.inverterMachine}" class="badge badge-neutral ml-auto">Inverter</span>
      </div>
    </div>
  </a>
</article>

<!-- Thẻ ngang, dùng trong bảng và danh sách gọn -->
<div th:fragment="dong(p)" class="flex items-center gap-3 min-w-0">
  <img th:src="${p.imageUrl}" alt="" class="w-11 h-11 rounded-lg object-contain bg-line-soft p-1 shrink-0">
  <div class="min-w-0">
    <p class="font-medium truncate" th:text="${p.name}">…</p>
    <p class="text-[12px] text-faint truncate">
      <span th:text="${p.modelCode}">…</span>
      <span th:if="${p.category != null}" th:text="' · ' + ${p.categoryName}">…</span>
    </p>
  </div>
</div>

</body>
</html>
