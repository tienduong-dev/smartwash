# ================== ỨNG DỤNG ==================
spring.application.name=SmartWash
server.port=8000
server.servlet.session.timeout=120m
spring.mvc.hiddenmethod.filter.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Thư mục chứa ảnh công khai (logo, ảnh sản phẩm), phục vụ qua /storage/...
app.upload-dir=uploads

# Thư mục chứa giấy tờ pháp lý của hồ sơ mở gian hàng.
# KHÔNG phục vụ tĩnh: phải tải qua /seller/documents/{id} để controller
# kiểm tra quyền trước (đặc tả mục 12.1).
app.private-upload-dir=uploads-private

# ================== DATABASE ==================
# Chọn hệ quản trị cơ sở dữ liệu ở đây:
#   sqlserver -> đọc thêm application-sqlserver.properties  (đang dùng)
#   mysql     -> đọc thêm application-mysql.properties      (bản cũ chạy XAMPP)
spring.profiles.active=sqlserver

# Dùng lại bảng có sẵn từ file SQL -> không để Hibernate tự sửa bảng
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# ================== MAIL (gửi mã OTP) ==================
